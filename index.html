        width: 60%;
        height: 100vh;
        border: 3px solid green;

        align-items: center;
        margin:auto auto;
        flex-direction: column;

    }

        font-size: 30px;
        text-transform: capitalize;
        border:none;
        text-align: center;
    }
    #username:focus,#password:focus

        outline: none;
        border-bottom: 4px solid green;
    }
    #b4_btns

        align-items: center;
    }

        height: 80px;
        width: 200px;
        font-size: 35px;
        text-transform: capitalize;
        font-weight: 600;
        color: green;
        border: 2px solid green;
        cursor: pointer;
        border-radius: 10px;
    }
    #go_btn:hover
    {
        background-color: green;
        color: white;
        transition: 0.5s;
        transform: scale(1.1);
    }
